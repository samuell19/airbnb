services:
  - type: web
    name: airbnb
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: airbnb-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false

databases:
  - name: airbnb-db
    databaseName: airbnb
    user: airbnb
